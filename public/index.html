<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bellingham AI</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0d12;color:#f5f7fa;min-height:100vh;display:grid;place-items:center}
    main{width:min(760px,92vw);padding:32px;border:1px solid #252a35;border-radius:24px;background:#11151d;box-shadow:0 20px 70px #0008}
    h1{margin:0 0 8px;font-size:42px}p{color:#9ca3af}.row{display:flex;gap:10px;margin-top:24px}textarea{flex:1;min-height:120px;background:#0b0d12;color:#fff;border:1px solid #303642;border-radius:14px;padding:16px;resize:vertical}
    button{border:0;border-radius:12px;padding:12px 18px;background:#fff;color:#111;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
    #answer{white-space:pre-wrap;margin-top:20px;padding:18px;border-radius:14px;background:#0b0d12;border:1px solid #252a35;min-height:60px}
  </style>
</head>
<body>
<main>
  <h1>Bellingham</h1>
  <p>Life planning dashboard · AI assistant</p>
  <textarea id="prompt" placeholder="Ask Bellingham to help plan your week..."></textarea>
  <div class="row">
    <button onclick="ask('puter')">Ask with Puter</button>
    <button onclick="ask('google')">Ask with Google</button>
  </div>
  <div id="answer">Ready.</div>
</main>
<script>
async function ask(provider){
  const prompt=document.getElementById('prompt').value.trim(), out=document.getElementById('answer');
  if(!prompt){out.textContent='Enter a prompt first.';return}
  out.textContent='Thinking...';
  try{
    if(provider==='puter'){
      if(!window.puter) throw new Error('Puter.js is not loaded.');
      const r=await window.puter.ai.chat(prompt,{model:'gpt-6-luna',serviceSpeed:'standard'});
      out.textContent=typeof r==='string'?r:(r?.message?.content||r?.text||JSON.stringify(r));
    }else{
      const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:prompt})});
      const data=await r.json();
      if(!r.ok) throw new Error(data.error||'Google AI request failed.');
      out.textContent=data.text||'No response returned.';
    }
  }catch(e){out.textContent='Error: '+e.message}
}
</script>
</body>
</html>
